<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani Radhakrishnan</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <img id="profile-pic" src="" alt="Mani Radhakrishnan" class="profile-img">
            <h1 id="name"></h1>
            <p id="tagline" class="tagline"></p>
            <nav class="links" id="nav-links"></nav>
        </header>

        <section id="bio" class="main-text"></section>

        <section class="content-section">
            <h2>Blockchain</h2>
            <ul id="blockchain-list"></ul>
        </section>

        <section class="content-section">
            <h2>Biology</h2>
            <ul id="biology-list"></ul>
        </section>

        <section class="content-section">
            <h2>Quantum Computing</h2>
            <ul id="quantum-list"></ul>
        </section>

        <section class="content-section">
            <h2>Economics</h2>
            <ul id="economics-list"></ul>
        </section>

        <footer>
            <p id="footer-text"></p>
        </footer>
    </div>

    <div id="reader-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch('contents/profile.json');
                const data = await res.json();

                // Basics & Image 
                document.getElementById('name').textContent = data.basics.name;
                document.getElementById('tagline').textContent = data.basics.tagline;
                document.getElementById('profile-pic').src = data.basics.image;
                document.getElementById('footer-text').textContent = `© 2026 ${data.basics.name}`;

                // Bio 
                const bioRes = await fetch(data.basics.summary_file);
                document.getElementById('bio').textContent = await bioRes.text();

                // Navigation 
                const nav = document.getElementById('nav-links');
                data.navigation.forEach(item => {
                    const a = document.createElement('a');
                    a.href = "#";
                    a.textContent = item.name;
                    a.onclick = () => loadContent(item.data_path);
                    nav.appendChild(a);
                });

                // Mapping files to the sections you requested
                setupList('blockchain-list', [{ name: 'Notes on Decentralization', path: 'contents/blockchain/notes.txt' }]);
                setupList('biology-list', [{ name: 'Living AI & Neuroscience', path: 'contents/interests/biology.txt' }]);
                setupList('quantum-list', [{ name: 'Quantum Gate Exploration', path: 'contents/tech/quantum.txt' }]);
                setupList('economics-list', [{ name: 'Corporate vs Country Economy', path: 'contents/blog/Big corporate vs Country Economy' }]);

            } catch (e) { console.error("Error loading profile:", e); }
        }

        function setupList(elementId, items) {
            const list = document.getElementById(elementId);
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" class="item-link" onclick="loadContent('${item.path}')">${item.name}</a>`;
                list.appendChild(li);
            });
        }

        async function loadContent(path) {
            const res = await fetch(path);
            const text = await res.text();
            document.getElementById('modal-body').innerHTML = `<pre class="modal-text">${text}</pre>`;
            document.getElementById('reader-modal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('reader-modal').style.display = "none";
        }

        init();
    </script>
</body>

</html>
