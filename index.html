<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani Radhakrishnan | AI Researcher & Engineer</title>
    <meta name="description" content="Personal website of Mani Radhakrishnan, an AI Researcher and Engineer focused on building and understanding intelligent systems.">
    <meta name="keywords" content="AI, Machine Learning, Robotics, AGI, Embodied AI, Research">
    <meta property="og:title" content="Mani Radhakrishnan">
    <meta property="og:description" content="AI Researcher & Engineer building frontier foundation models.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="assets/css/styles.css?v=1.0.3">
</head>

<body>
    <div class="bg-neural-network"></div>
    <div class="bg-glow"></div>
    <div class="container">
        <header>
            <div class="header-top">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                    <span class="sun">☀️</span>
                    <span class="moon">🌙</span>
                </button>
            </div>
            <div class="profile-container">
                <img id="profile-pic" src="" alt="Mani Radhakrishnan" class="profile-img">
                <div class="header-info">
                    <div class="name-container">
                        <h1 id="name"></h1>
                        <div class="header-symbols" aria-hidden="true">
                            <!-- Brain Icon -->
                            <svg class="header-symbol-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
                                <path d="M9 13a4.5 4.5 0 0 0 3-4" />
                                <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
                                <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
                                <path d="M6 18a4 4 0 0 1-1.967-.516" />
                                <path d="M12 13h4" />
                                <path d="M12 18h6a2 2 0 0 1 2 2v1" />
                                <path d="M12 8h8" />
                                <path d="M16 8V5a2 2 0 0 1 2-2" />
                                <circle cx="16" cy="13" r=".5" />
                                <circle cx="18" cy="3" r=".5" />
                                <circle cx="20" cy="21" r=".5" />
                                <circle cx="20" cy="8" r=".5" />
                            </svg>
                            <!-- Neural Network Icon -->
                            <svg class="header-symbol-svg" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="4" cy="6" r="1.5" fill="currentColor"/>
                                <circle cx="4" cy="12" r="1.5" fill="currentColor"/>
                                <circle cx="4" cy="18" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="4" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="9.3" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="14.7" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="20" r="1.5" fill="currentColor"/>
                                <circle cx="20" cy="8" r="1.5" fill="currentColor"/>
                                <circle cx="20" cy="16" r="1.5" fill="currentColor"/>
                                <line x1="4" y1="6" x2="12" y2="4" opacity="0.4"/>
                                <line x1="4" y1="6" x2="12" y2="9.3" opacity="0.4"/>
                                <line x1="4" y1="6" x2="12" y2="14.7" opacity="0.4"/>
                                <line x1="4" y1="12" x2="12" y2="4" opacity="0.4"/>
                                <line x1="4" y1="12" x2="12" y2="9.3" opacity="0.4"/>
                                <line x1="4" y1="12" x2="12" y2="14.7" opacity="0.4"/>
                                <line x1="4" y1="12" x2="12" y2="20" opacity="0.4"/>
                                <line x1="4" y1="18" x2="12" y2="9.3" opacity="0.4"/>
                                <line x1="4" y1="18" x2="12" y2="14.7" opacity="0.4"/>
                                <line x1="4" y1="18" x2="12" y2="20" opacity="0.4"/>
                                <line x1="12" y1="4" x2="20" y2="8" opacity="0.4"/>
                                <line x1="12" y1="4" x2="20" y2="16" opacity="0.4"/>
                                <line x1="12" y1="9.3" x2="20" y2="8" opacity="0.4"/>
                                <line x1="12" y1="9.3" x2="20" y2="16" opacity="0.4"/>
                                <line x1="12" y1="14.7" x2="20" y2="8" opacity="0.4"/>
                                <line x1="12" y1="14.7" x2="20" y2="16" opacity="0.4"/>
                                <line x1="12" y1="20" x2="20" y2="8" opacity="0.4"/>
                                <line x1="12" y1="20" x2="20" y2="16" opacity="0.4"/>
                            </svg>
                        </div>
                    </div>
                    <p id="tagline" class="tagline"></p>
                    <div class="social-links" id="social-links"></div>
                </div>
            </div>
        </header>

        <section id="bio" class="main-text"></section>

        <div id="experience-area"></div>
        <div id="education-area"></div>
        <div id="content-areas"></div>

        <footer>
            <p id="footer-text"></p>
        </footer>
    </div>

    <div id="reader-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch('contents/profile.json?v=' + Date.now());
                if (!res.ok) throw new Error('Could not find profile.json');
                const data = await res.json();

                document.getElementById('name').textContent = data.basics.name;
                document.getElementById('tagline').textContent = data.basics.tagline;
                // Cache-buster added here
                document.getElementById('profile-pic').src = data.basics.image + '?v=' + Date.now();
                document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} ${data.basics.name}`;

                // Setup Socials
                const socials = document.getElementById('social-links');
                Object.entries(data.socials).forEach(([key, value]) => {
                    const a = document.createElement('a');
                    a.href = key === 'mail' ? `mailto:${value}` : (value.startsWith('http') ? value : `https://${value}`);
                    a.textContent = key.charAt(0).toUpperCase() + key.slice(1);
                    a.target = "_blank";
                    socials.appendChild(a);
                });

                // Fetch and clean Bio
                const bioRes = await fetch(data.basics.summary_file + '?v=' + Date.now());
                if (bioRes.ok) {
                    const bioRaw = await bioRes.text();
                    const bioContainer = document.getElementById('bio');
                    // Clean up Markdown headers like # BIO
                    const cleanRaw = bioRaw.replace(/^#+\s*BIO\s*/i, '').trim();
                    bioContainer.innerHTML = cleanRaw
                        .split('\n\n')
                        .map(para => `<p>${para.replace(/\n/g, ' ')}</p>`)
                        .join('');
                }

                // Setup Experience section
                if (data.experience) {
                    const expArea = document.getElementById('experience-area');
                    const section = document.createElement('section');
                    section.innerHTML = `<h2>Experience</h2><ul id="exp-list"></ul>`;
                    expArea.appendChild(section);
                    const list = section.querySelector('ul');
                    data.experience.forEach(exp => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span class="item-meta">${exp.period}</span> <span><strong>${exp.role}</strong>, ${exp.company}</span>`;
                        list.appendChild(li);
                    });
                }

                // Setup Education section
                if (data.education) {
                    const eduArea = document.getElementById('education-area');
                    const section = document.createElement('section');
                    section.innerHTML = `<h2>Education</h2><ul id="edu-list"></ul>`;
                    eduArea.appendChild(section);
                    const list = section.querySelector('ul');
                    data.education.forEach(edu => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span class="item-meta">${edu.period || edu.score}</span> <span><strong>${edu.degree}</strong>, ${edu.school || ''} ${edu.meta ? `(${edu.meta})` : ''}</span>`;
                        list.appendChild(li);
                    });
                }

                // Setup Content Sections
                const contentAreas = document.getElementById('content-areas');
                if (data.content_sections) {
                    data.content_sections.forEach(cat => {
                        const section = document.createElement('section');
                        section.innerHTML = `
                            <h2>${cat.title}</h2>
                            <ul id="${cat.id}-list"></ul>
                        `;
                        contentAreas.appendChild(section);
                        
                        const list = section.querySelector('ul');
                        if (cat.items && cat.items.length > 0) {
                            cat.items.forEach(item => {
                                const li = document.createElement('li');
                                li.innerHTML = `<a href="#" class="item-link" onclick="event.preventDefault(); loadContent('${item.path}')">${item.name}</a>`;
                                list.appendChild(li);
                            });
                        } else {
                            const li = document.createElement('li');
                            li.innerHTML = `<span class="item-meta">Coming soon...</span>`;
                            list.appendChild(li);
                        }
                    });
                }

                // Theme Toggle Logic
                const themeBtn = document.getElementById('theme-toggle');
                const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', currentTheme);

                themeBtn.onclick = () => {
                    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                };

            } catch (err) {
                console.error("Initialization Error:", err);
                document.getElementById('bio').textContent = "Failed to load content. Please check the console for details.";
            }
        }

        async function loadContent(path) {
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error('File not found');
                const text = await res.text();
                document.getElementById('modal-body').innerHTML = `<div class="modal-text">${text}</div>`;
                document.getElementById('reader-modal').style.display = "block";
                document.body.style.overflow = "hidden";
            } catch (e) {
                console.error("Content Load Error:", e);
                alert("Could not load: " + path);
            }
        }

        function closeModal() {
            document.getElementById('reader-modal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        init();
    </script>
</body>

</html>
